<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ders Durumu</title>
  <style>
    :root {
      --bg: #0c0d12;
      --card-bg: #15171f;
      --border: #232733;
      --text: #f3f4f6;
      --text-muted: #8b92a5;
      --green: #10b981;
      --idle: #4b5563;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 2.75rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--idle);
    }
    .dot.live {
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.4; }
    }
    .timer {
      font-size: 4.8rem;
      font-weight: 800;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
    }
    .time-range {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #d1d5db;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      margin-top: 2rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 1s linear;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="badge">
    <span class="dot" id="status-dot"></span>
    <span id="status-label">Bağlanıyor...</span>
  </div>

  <div class="timer" id="timer-display">--:--</div>
  <div class="subtitle" id="sub-label">Sunucu kontrol ediliyor...</div>

  <div class="time-range" id="time-range-display">
    <span id="range-text">--:-- - --:--</span>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress-bar"></div>
  </div>
</div>

<script>
  // Kendi Vercel URL'ini buraya yaz:
  const API_URL = "https://durum-five.vercel.app.vercel.app/api/session";

  let targetEndTime = null;
  let totalDurationMs = null;

  function formatTime(timestamp) {
    const d = new Date(timestamp);
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    return `${hours}:${minutes}`;
  }

  async function syncStatus() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      const timer = document.getElementById('timer-display');
      const sub = document.getElementById('sub-label');
      const progress = document.getElementById('progress-bar');
      const rangeBox = document.getElementById('time-range-display');
      const rangeText = document.getElementById('range-text');

      if (data.active) {
        targetEndTime = data.endsAt;
        totalDurationMs = data.durationMinutes * 60 * 1000;
        dot.className = 'dot live';
        label.innerText = data.note || 'Ders Devam Ediyor';
        
        // Başlama ve bitiş saatlerini yazdır
        const startStr = formatTime(data.startedAt);
        const endStr = formatTime(data.endsAt);
        rangeText.innerText = `${startStr} – ${endStr}`;
        rangeBox.style.display = 'inline-flex';

        updateClock();
      } else {
        targetEndTime = null;
        dot.className = 'dot';
        label.innerText = 'Şu an Ders Yok';
        timer.innerText = '00:00';
        sub.innerText = 'Aktif bir seans bulunmuyor';
        progress.style.width = '0%';
        rangeBox.style.display = 'none';
      }
    } catch (e) {
      console.error("Senkronizasyon hatası:", e);
    }
  }

  function updateClock() {
    if (!targetEndTime) return;

    const remaining = Math.max(0, targetEndTime - Date.now());
    const timer = document.getElementById('timer-display');
    const sub = document.getElementById('sub-label');
    const progress = document.getElementById('progress-bar');

    if (remaining <= 0) {
      syncStatus();
      return;
    }

    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    timer.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    sub.innerText = 'Dersin bitmesine kaldı';

    if (totalDurationMs) {
      const elapsed = totalDurationMs - remaining;
      const pct = Math.min(100, Math.max(0, (elapsed / totalDurationMs) * 100));
      progress.style.width = `${pct}%`;
    }
  }

  syncStatus();
  setInterval(updateClock, 1000);
  setInterval(syncStatus, 15000);
</script>

</body>
</html>
